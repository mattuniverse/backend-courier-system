services:
  - type: web
    name: courier-parcel-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false        # Supabase PostgreSQL URI
      - key: SECRET_KEY
        sync: false        # Generate with: python -c "import secrets; print(secrets.token_urlsafe(48))"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "480"
      - key: CORS_ORIGINS
        sync: false        # Your Vercel frontend URL
